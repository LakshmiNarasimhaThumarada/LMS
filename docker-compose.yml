version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/edumind
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - ./data/pdfs:/app/data/pdfs # Keep PDFs persistent
  
  celery_worker:
    build: ./backend
    command: celery -A backend.workers.celery_app worker --loglevel=info
    environment:
      - MONGO_URI=mongodb://mongo:27017/edumind
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - mongo
  
  celery_beat:
    build: ./backend
    command: celery -A backend.workers.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
  
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  frontend:
    # Assuming frontend Dockerfile is in ./frontend if we were to build it, 
    # but for now we'll just run it as a service if requested. 
    # Streamlit usually needs its own Dockerfile.
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
